<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Painel ADM — bygdëall</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#050505;
  color:#eee;
  font-family:Arial,sans-serif;
}

/* LOGIN */

#login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:350px;
  background:#111;
  border:1px solid #292929;
  border-radius:15px;
  padding:30px;
  text-align:center;
}

.login-box h1{
  margin-bottom:8px;
}

.login-box p{
  color:#999;
  font-size:13px;
  margin-bottom:22px;
}

input{
  width:100%;
  padding:13px;
  margin-bottom:12px;
  border-radius:8px;
  border:1px solid #333;
  background:#181818;
  color:#fff;
  outline:none;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#b4232f;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#e02e3d;
}

.erro{
  color:#ff4545;
  font-size:13px;
  margin-top:12px;
}

/* PAINEL */

#painel{
  display:none;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 20px;
  background:#101010;
  border-bottom:1px solid #292929;
}

header button{
  width:auto;
  padding:9px 14px;
  background:transparent;
  border:1px solid #333;
}

.container{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:20px;
}

.card{
  background:#101010;
  border:1px solid #292929;
  border-radius:14px;
  padding:20px;
  margin-bottom:18px;
}

.card h2{
  margin-bottom:15px;
  font-size:18px;
}

label{
  display:block;
  color:#aaa;
  font-size:13px;
  margin-bottom:7px;
}

.video-box{
  margin-top:10px;
}

video{
  width:100%;
  max-height:300px;
  border-radius:10px;
  background:#000;
  display:none;
  object-fit:cover;
}

.file-button{
  display:block;
  width:100%;
  padding:13px;
  border-radius:8px;
  background:#191919;
  border:1px solid #333;
  text-align:center;
  cursor:pointer;
  margin-bottom:12px;
}

.status{
  color:#3cb371;
  font-size:13px;
  margin-top:10px;
}

.info{
  color:#999;
  font-size:13px;
  line-height:1.5;
}

.logout{
  color:#fff;
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="login">

  <div class="login-box">

    <h1>bygdëall 🇯🇵</h1>

    <p>Painel ADM — acesso restrito</p>

    <input
      id="email"
      type="email"
      placeholder="E-mail"
    >

    <input
      id="senha"
      type="password"
      placeholder="Senha"
    >

    <button onclick="entrar()">
      Entrar
    </button>

    <div id="erro" class="erro"></div>

  </div>

</section>


<!-- PAINEL -->

<section id="painel">

  <header>

    <strong>Painel ADM</strong>

    <button onclick="sair()">
      Sair
    </button>

  </header>


  <main class="container">

    <!-- VÍDEO -->

    <div class="card">

      <h2>🎥 Vídeo de fundo</h2>

      <p class="info">
        Escolha um vídeo diretamente da galeria
        do celular ou computador.
      </p>

      <br>

      <label>
        Vídeo do fundo
      </label>

      <label
        class="file-button"
        for="videoInput"
      >
        📁 Escolher vídeo da galeria
      </label>

      <input
        id="videoInput"
        type="file"
        accept="video/*"
        style="display:none"
      >

      <div class="video-box">

        <video
          id="videoPreview"
          controls
          muted
          playsinline
        ></video>

      </div>

      <div
        id="videoStatus"
        class="status"
      ></div>

    </div>


    <!-- TÍTULO -->

    <div class="card">

      <h2>📝 Informações do site</h2>

      <label>
        Título
      </label>

      <input
        id="titulo"
        type="text"
        placeholder="bygdëall 🇯🇵"
      >

      <label>
        Frase
      </label>

      <input
        id="frase"
        type="text"
        placeholder="Unidos somos mais fortes"
      >

      <button onclick="salvarInfo()">
        Salvar informações
      </button>

      <div
        id="infoStatus"
        class="status"
      ></div>

    </div>


    <!-- STATUS -->

    <div class="card">

      <h2>⚙️ Status</h2>

      <p class="info">
        Painel ADM funcionando localmente.
        <br><br>
        Login: protegido por sessão do navegador.
        <br>
        Vídeo: selecionado diretamente da galeria.
      </p>

    </div>

  </main>

</section>


<script>

/*
====================================================
LOGIN ADM
====================================================

IMPORTANTE:
Este login é apenas para esconder/proteger
a interface no navegador.

Para segurança real, depois precisamos de
autenticação no servidor.
*/

const ADMIN_EMAIL = "admin@bygdeall.com";
const ADMIN_SENHA = "Bygdeall@2026";


function entrar(){

  const email =
    document.getElementById("email").value.trim();

  const senha =
    document.getElementById("senha").value;

  const erro =
    document.getElementById("erro");


  if(
    email === ADMIN_EMAIL &&
    senha === ADMIN_SENHA
  ){

    sessionStorage.setItem(
      "adminLogado",
      "true"
    );

    mostrarPainel();

  }else{

    erro.textContent =
      "E-mail ou senha inválidos.";

  }

}


function mostrarPainel(){

  document.getElementById("login")
    .style.display = "none";

  document.getElementById("painel")
    .style.display = "block";

}


function sair(){

  sessionStorage.removeItem(
    "adminLogado"
  );

  location.reload();

}


/* VERIFICAR LOGIN */

if(
  sessionStorage.getItem("adminLogado")
  === "true"
){

  mostrarPainel();

}


/* =========================================
   VÍDEO DA GALERIA
========================================= */

document
  .getElementById("videoInput")
  .addEventListener("change", function(event){

    const arquivo =
      event.target.files[0];

    if(!arquivo){
      return;
    }


    if(!arquivo.type.startsWith("video/")){

      document.getElementById(
        "videoStatus"
      ).textContent =
        "Escolha um arquivo de vídeo.";

      return;

    }


    const video =
      document.getElementById(
        "videoPreview"
      );


    /*
    Cria uma prévia local do vídeo.
    */

    video.src =
      URL.createObjectURL(arquivo);

    video.style.display = "block";


    document.getElementById(
      "videoStatus"
    ).textContent =
      "✅ Vídeo selecionado.";


    /*
    Tenta iniciar a reprodução.
    */

    video.play().catch(() => {});

  });


/* =========================================
   INFORMAÇÕES
========================================= */

function salvarInfo(){

  const titulo =
    document.getElementById(
      "titulo"
    ).value;

  const frase =
    document.getElementById(
      "frase"
    ).value;


  localStorage.setItem(
    "siteTitulo",
    titulo
  );

  localStorage.setItem(
    "siteFrase",
    frase
  );


  document.getElementById(
    "infoStatus"
  ).textContent =
    "✅ Informações salvas neste navegador.";

}


/* CARREGAR INFORMAÇÕES */

document.getElementById(
  "titulo"
).value =
  localStorage.getItem(
    "siteTitulo"
  ) || "";


document.getElementById(
  "frase"
).value =
  localStorage.getItem(
    "siteFrase"
  ) || "";

</script>

</body>
  </html>
