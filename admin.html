<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel ADM — ALIANÇA SK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050505;--surface:#0F0E0E;--surface-2:#171514;--line:#2A2422;
    --text:#EDEAE3;--muted:#9C9690;--red:#B4232F;--red-glow:#FF3B3B;--gold:#D4AF37;--green:#3CB371;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  a{color:inherit;}
  h1,h2{font-family:'Cinzel',serif;}
  .wrap{max-width:640px;margin:0 auto;padding:20px;}

  /* LOGIN */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:34px 26px;width:100%;max-width:340px;text-align:center;}
  .login-box h1{font-size:22px;margin-bottom:6px;}
  .login-box p{color:var(--muted);font-size:13px;margin-bottom:22px;}
  input, textarea, select{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:12px 14px;border-radius:8px;font-size:14.5px;font-family:'Inter',sans-serif;margin-bottom:12px;
  }
  input::placeholder, textarea::placeholder{color:#65605B;}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  button{
    cursor:pointer;border:none;border-radius:8px;padding:13px 18px;font-weight:600;font-size:14px;
    background:var(--red);color:#fff;transition:.2s;width:100%;
  }
  button:hover{background:var(--red-glow);}
  button.secondary{background:transparent;border:1px solid var(--line);color:var(--text);}
  button.secondary:hover{border-color:var(--red-glow);color:var(--red-glow);}
  button.danger{background:transparent;border:1px solid #5B2323;color:#E88;padding:8px 12px;font-size:12.5px;width:auto;}
  .error-msg{color:var(--red-glow);font-size:13px;margin-top:10px;min-height:16px;}

  /* DASHBOARD */
  #dashboard{display:none;}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;
    border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:10;}
  header.top .brand{font-family:'Cinzel',serif;font-size:16px;font-weight:700;}
  header.top button{width:auto;padding:8px 14px;font-size:12.5px;}

  .tabs{display:flex;overflow-x:auto;gap:6px;padding:14px 20px 0;}
  .tab-btn{flex:0 0 auto;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:transparent;
    color:var(--muted);font-size:13px;width:auto;font-weight:500;}
  .tab-btn.active{border-color:var(--red-glow);color:var(--red-glow);background:rgba(180,35,47,.08);}

  .panel{display:none;}
  .panel.active{display:block;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .card h2{font-size:17px;margin-bottom:14px;}
  .status{font-size:12.5px;color:var(--green);min-height:16px;margin-top:4px;}
  .status.err{color:var(--red-glow);}

  .list-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .list-item:last-child{border-bottom:none;}
  .list-item img{width:52px;height:52px;object-fit:cover;border-radius:8px;background:var(--surface-2);flex:0 0 52px;}
  .list-item .info{flex:1;min-width:0;}
  .list-item .info .n{font-weight:600;font-size:14px;}
  .list-item .info .s{color:var(--muted);font-size:12px;}
  .list-item .actions{display:flex;gap:6px;}
  .btn-icon{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;
    background:transparent;border:1px solid var(--line);border-radius:8px;}
  .btn-icon:hover{border-color:var(--red-glow);}

  .upload-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .upload-row img, .upload-row video{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--surface-2);}
  .file-btn{width:auto;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-size:12.5px;padding:9px 14px;}
  .progress-bar{height:4px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:8px;display:none;}
  .progress-bar > div{height:100%;background:var(--red-glow);width:0%;transition:width .2s;}

  .galeria-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .galeria-mini .item{position:relative;}
  .galeria-mini img{width:100%;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--line);}
  .galeria-mini .del{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;
    background:rgba(0,0,0,.7);border:1px solid var(--line);color:#fff;font-size:14px;line-height:1;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>ALIANÇA SK</h1>
    <p>Painel ADM — acesso restrito</p>
    <input type="email" id="loginEmail" placeholder="E-mail">
    <input type="password" id="loginPass" placeholder="Senha">
    <button id="loginBtn">Entrar</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<div id="dashboard">
  <header class="top">
    <div class="brand">Painel ADM</div>
    <button id="logoutBtn" class="secondary">Sair</button>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="hero">Hero</button>
    <button class="tab-btn" data-tab="itens">Grupos/Canais</button>
    <button class="tab-btn" data-tab="avisos">Avisos</button>
    <button class="tab-btn" data-tab="sobre">Sobre</button>
    <button class="tab-btn" data-tab="galeria">Galeria</button>
    <button class="tab-btn" data-tab="contato">Contato</button>
  </div>

  <div class="wrap">

    <!-- HERO -->
    <div class="panel active" id="panel-hero">
      <div class="card">
        <h2>Topo do site</h2>
        <label>Logo (aparece no topo e no menu)</label>
        <div class="upload-row">
          <img id="previewLogo" src="" style="display:none">
          <input type="file" accept="image/*" id="inputLogo" style="display:none">
          <button class="file-btn" onclick="document.getElementById('inputLogo').click()">Escolher da galeria</button>
        </div>

        <label>Fundo do topo (foto ou vídeo)</label>
        <select id="heroMediaType"><option value="image">Foto</option><option value="video">Vídeo</option></select>
        <div class="upload-row">
          <img id="previewMediaImg" src="" style="display:none">
          <video id="previewMediaVideo" muted style="display:none"></video>
          <input type="file" accept="image/*,video/*" id="inputMedia" style="display:none">
          <button class="file-btn" onclick="document.getElementById('inputMedia').click()">Escolher da galeria</button>
        </div>
        <div class="progress-bar" id="heroProgress"><div></div></div>

        <label>Título</label>
        <input type="text" id="heroTitle" placeholder="ALIANÇA SK">
        <label>Frase de efeito</label>
        <input type="text" id="heroMotto" placeholder="Unidos somos mais fortes">
        <label>Total de afiliados (número manual)</label>
        <input type="number" id="totalAfiliados" placeholder="0">
        <button id="saveHero">Salvar topo</button>
        <div class="status" id="statusHero"></div>
      </div>
    </div>

    <!-- ITENS -->
    <div class="panel" id="panel-itens">
      <div class="card">
        <h2 id="itemFormTitle">Adicionar grupo / canal / VIP</h2>
        <label>Tipo</label>
        <select id="itemTipo">
          <option value="grupo">Grupo</option>
          <option value="canal">Canal</option>
          <option value="vip">VIP</option>
        </select>
        <label>Nome</label>
        <input type="text" id="itemNome" placeholder="Ex: Chat Ünikz">
        <label>Dono</label>
        <input type="text" id="itemDono" placeholder="Ex: Bruxo">
        <label>Nº de membros</label>
        <input type="number" id="itemMembros" placeholder="0">
        <label>Link (WhatsApp / Telegram / Discord)</label>
        <input type="text" id="itemLink" placeholder="https://...">
        <label>Foto do card</label>
        <div class="upload-row">
          <img id="previewItemImg" src="" style="display:none">
          <input type="file" accept="image/*" id="inputItemImg" style="display:none">
          <button class="file-btn" onclick="document.getElementById('inputItemImg').click()">Escolher da galeria</button>
        </div>
        <div class="progress-bar" id="itemProgress"><div></div></div>
        <input type="hidden" id="itemEditId">
        <button id="saveItem">Adicionar</button>
        <button class="secondary" id="cancelEditItem" style="display:none;margin-top:8px;">Cancelar edição</button>
        <div class="status" id="statusItem"></div>
      </div>

      <div class="card">
        <h2>Itens cadastrados</h2>
        <div id="itemsList"></div>
      </div>
    </div>

    <!-- AVISOS -->
    <div class="panel" id="panel-avisos">
      <div class="card">
        <h2>Novo aviso</h2>
        <label>Tipo</label>
        <select id="avisoTipo"><option value="alerta">Alerta</option><option value="info">Info</option></select>
        <label>Título</label>
        <input type="text" id="avisoTitulo" placeholder="Ex: Manutenção Programada">
        <label>Texto</label>
        <textarea id="avisoTexto" rows="3" placeholder="Detalhes do aviso..."></textarea>
        <button id="saveAviso">Publicar aviso</button>
        <div class="status" id="statusAviso"></div>
      </div>
      <div class="card">
        <h2>Avisos publicados</h2>
        <div id="avisosList"></div>
      </div>
    </div>

    <!-- SOBRE -->
    <div class="panel" id="panel-sobre">
      <div class="card">
        <h2>Texto "Sobre a Aliança"</h2>
        <textarea id="sobreTexto" rows="6" placeholder="A ALIANÇA SK é..."></textarea>
        <button id="saveSobre">Salvar</button>
        <div class="status" id="statusSobre"></div>
      </div>
    </div>

    <!-- GALERIA -->
    <div class="panel" id="panel-galeria">
      <div class="card">
        <h2>Adicionar imagens à galeria</h2>
        <input type="file" accept="image/*" multiple id="inputGaleria" style="display:none">
        <button class="file-btn" style="width:100%" onclick="document.getElementById('inputGaleria').click()">Escolher da galeria</button>
        <div class="progress-bar" id="galeriaProgress"><div></div></div>
        <div class="status" id="statusGaleria"></div>
      </div>
      <div class="card">
        <h2>Imagens atuais</h2>
        <div class="galeria-mini" id="galeriaMini"></div>
      </div>
    </div>

    <!-- CONTATO -->
    <div class="panel" id="panel-contato">
      <div class="card">
        <h2>Dados de contato</h2>
        <label>E-mail</label>
        <input type="email" id="contatoEmail" placeholder="contato@aliancask.com">
        <label>Instagram (link completo)</label>
        <input type="text" id="contatoInstagram" placeholder="https://instagram.com/...">
        <label>Facebook (link completo)</label>
        <input type="text" id="contatoFacebook" placeholder="https://facebook.com/...">
        <label>Discord (link completo)</label>
        <input type="text" id="contatoDiscord" placeholder="https://discord.gg/...">
        <button id="saveContato">Salvar</button>
        <div class="status" id="statusContato"></div>
      </div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* ---------- LOGIN ---------- */
auth.onAuthStateChanged(user => {
  document.getElementById('loginScreen').style.display = user ? 'none' : 'flex';
  document.getElementById('dashboard').style.display = user ? 'block' : 'none';
  if (user) initDashboardData();
});

document.getElementById('loginBtn').addEventListener('click', () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  auth.signInWithEmailAndPassword(email, pass)
    .catch(err => document.getElementById('loginError').textContent = 'E-mail ou senha inválidos.');
});
document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());

/* ---------- TABS ---------- */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

function setStatus(id, msg, isErr){
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.toggle('err', !!isErr);
  setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 4000);
}

function uploadFile(file, path, progressBarId, cb){
  const ref = storage.ref().child(path + '/' + Date.now() + '_' + file.name);
  const task = ref.put(file);
  const bar = document.getElementById(progressBarId);
  if (bar) bar.style.display = 'block';
  task.on('state_changed', snap => {
    const pct = (snap.bytesTransferred / snap.totalBytes) * 100;
    if (bar) bar.querySelector('div').style.width = pct + '%';
  }, err => {
    if (bar) bar.style.display = 'none';
    cb(null, err);
  }, () => {
    task.snapshot.ref.getDownloadURL().then(url => {
      if (bar) bar.style.display = 'none';
      cb(url, null);
    });
  });
}

/* ---------- HERO ---------- */
let heroLogoUrl = '', heroMediaUrl = '';

document.getElementById('inputLogo').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const preview = document.getElementById('previewLogo');
  preview.src = URL.createObjectURL(file); preview.style.display = 'block';
  uploadFile(file, 'hero', 'heroProgress', (url, err) => {
    if (err){ setStatus('statusHero', 'Erro ao enviar logo.', true); return; }
    heroLogoUrl = url;
  });
});

document.getElementById('inputMedia').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const isVideo = file.type.startsWith('video');
  document.getElementById('heroMediaType').value = isVideo ? 'video' : 'image';
  const imgP = document.getElementById('previewMediaImg');
  const vidP = document.getElementById('previewMediaVideo');
  if (isVideo){
    vidP.src = URL.createObjectURL(file); vidP.style.display = 'block'; imgP.style.display = 'none';
  } else {
    imgP.src = URL.createObjectURL(file); imgP.style.display = 'block'; vidP.style.display = 'none';
  }
  uploadFile(file, 'hero', 'heroProgress', (url, err) => {
    if (err){ setStatus('statusHero', 'Erro ao enviar mídia.', true); return; }
    heroMediaUrl = url;
  });
});

document.getElementById('saveHero').addEventListener('click', () => {
  const data = {
    heroTitle: document.getElementById('heroTitle').value,
    heroMotto: document.getElementById('heroMotto').value,
    totalAfiliados: Number(document.getElementById('totalAfiliados').value) || 0,
    heroMediaType: document.getElementById('heroMediaType').value
  };
  if (heroLogoUrl) data.heroLogoUrl = heroLogoUrl;
  if (heroMediaUrl) data.heroMediaUrl = heroMediaUrl;
  db.collection('config').doc('site').set(data, { merge: true })
    .then(() => setStatus('statusHero', 'Topo salvo com sucesso.'))
    .catch(() => setStatus('statusHero', 'Erro ao salvar.', true));
});

/* ---------- ITENS (grupos/canais/vip) ---------- */
let itemImgUrl = '';
document.getElementById('inputItemImg').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const preview = document.getElementById('previewItemImg');
  preview.src = URL.createObjectURL(file); preview.style.display = 'block';
  uploadFile(file, 'itens', 'itemProgress', (url, err) => {
    if (err){ setStatus('statusItem', 'Erro ao enviar imagem.', true); return; }
    itemImgUrl = url;
  });
});

function resetItemForm(){
  document.getElementById('itemEditId').value = '';
  document.getElementById('itemNome').value = '';
  document.getElementById('itemDono').value = '';
  document.getElementById('itemMembros').value = '';
  document.getElementById('itemLink').value = '';
  document.getElementById('previewItemImg').style.display = 'none';
  itemImgUrl = '';
  document.getElementById('itemFormTitle').textContent = 'Adicionar grupo / canal / VIP';
  document.getElementById('saveItem').textContent = 'Adicionar';
  document.getElementById('cancelEditItem').style.display = 'none';
}

document.getElementById('saveItem').addEventListener('click', () => {
  const id = document.getElementById('itemEditId').value;
  const data = {
    tipo: document.getElementById('itemTipo').value,
    nome: document.getElementById('itemNome').value,
    dono: document.getElementById('itemDono').value,
    membros: Number(document.getElementById('itemMembros').value) || 0,
    link: document.getElementById('itemLink').value,
    ordem: Date.now()
  };
  if (itemImgUrl) data.imagemUrl = itemImgUrl;
  if (!data.nome){ setStatus('statusItem', 'Informe o nome.', true); return; }

  const promise = id
    ? db.collection('items').doc(id).set(data, { merge: true })
    : db.collection('items').add(data);

  promise.then(() => { setStatus('statusItem', 'Salvo com sucesso.'); resetItemForm(); })
    .catch(() => setStatus('statusItem', 'Erro ao salvar.', true));
});

document.getElementById('cancelEditItem').addEventListener('click', resetItemForm);

db.collection('items').orderBy('ordem', 'desc').onSnapshot(snap => {
  const el = document.getElementById('itemsList');
  if (snap.empty){ el.innerHTML = '<p style="color:var(--muted);font-size:13px;">Nenhum item cadastrado.</p>'; return; }
  el.innerHTML = snap.docs.map(d => {
    const it = d.data();
    return `
    <div class="list-item">
      <img src="${it.imagemUrl || ''}">
      <div class="info">
        <div class="n">${it.nome} <span style="color:var(--muted);font-size:11px;">(${it.tipo})</span></div>
        <div class="s">${it.membros || 0} membros</div>
      </div>
      <div class="actions">
        <button class="btn-icon" onclick="editItem('${d.id}')">✎</button>
        <button class="btn-icon" onclick="deleteItem('${d.id}')">🗑</button>
      </div>
    </div>`;
  }).join('');
  window._itemsCache = {};
  snap.docs.forEach(d => window._itemsCache[d.id] = d.data());
});

window.editItem = function(id){
  const it = window._itemsCache[id];
  document.getElementById('itemEditId').value = id;
  document.getElementById('itemTipo').value = it.tipo;
  document.getElementById('itemNome').value = it.nome || '';
  document.getElementById('itemDono').value = it.dono || '';
  document.getElementById('itemMembros').value = it.membros || '';
  document.getElementById('itemLink').value = it.link || '';
  if (it.imagemUrl){
    document.getElementById('previewItemImg').src = it.imagemUrl;
    document.getElementById('previewItemImg').style.display = 'block';
  }
  document.getElementById('itemFormTitle').textContent = 'Editar item';
  document.getElementById('saveItem').textContent = 'Salvar alterações';
  document.getElementById('cancelEditItem').style.display = 'block';
  document.querySelector('.tab-btn[data-tab="itens"]').click();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.deleteItem = function(id){
  if (!confirm('Remover este item?')) return;
  db.collection('items').doc(id).delete();
};

/* ---------- AVISOS ---------- */
document.getElementById('saveAviso').addEventListener('click', () => {
  const titulo = document.getElementById('avisoTitulo').value;
  const texto = document.getElementById('avisoTexto').value;
  if (!titulo){ setStatus('statusAviso', 'Informe o título.', true); return; }
  db.collection('avisos').add({
    tipo: document.getElementById('avisoTipo').value,
    titulo, texto, criadoEm: Date.now()
  }).then(() => {
    setStatus('statusAviso', 'Aviso publicado.');
    document.getElementById('avisoTitulo').value = '';
    document.getElementById('avisoTexto').value = '';
  });
});

db.collection('avisos').orderBy('criadoEm', 'desc').onSnapshot(snap => {
  const el = document.getElementById('avisosList');
  if (snap.empty){ el.innerHTML = '<p style="color:var(--muted);font-size:13px;">Nenhum aviso.</p>'; return; }
  el.innerHTML = snap.docs.map(d => `
    <div class="list-item">
      <div class="info">
        <div class="n">${d.data().titulo}</div>
        <div class="s">${d.data().tipo}</div>
      </div>
      <div class="actions"><button class="btn-icon" onclick="deleteAviso('${d.id}')">🗑</button></div>
    </div>`).join('');
});
window.deleteAviso = function(id){ if (confirm('Remover aviso?')) db.collection('avisos').doc(id).delete(); };

/* ---------- SOBRE ---------- */
document.getElementById('saveSobre').addEventListener('click', () => {
  db.collection('config').doc('sobre').set({ texto: document.getElementById('sobreTexto').value })
    .then(() => setStatus('statusSobre', 'Salvo com sucesso.'));
});

/* ---------- GALERIA ---------- */
document.getElementById('inputGaleria').addEventListener('change', e => {
  const files = Array.from(e.target.files);
  files.forEach(file => {
    uploadFile(file, 'galeria', 'galeriaProgress', (url, err) => {
      if (err){ setStatus('statusGaleria', 'Erro ao enviar imagem.', true); return; }
      db.collection('galeria').add({ imagemUrl: url, criadoEm: Date.now() });
      setStatus('statusGaleria', 'Imagem adicionada.');
    });
  });
});

db.collection('galeria').orderBy('criadoEm', 'desc').onSnapshot(snap => {
  const el = document.getElementById('galeriaMini');
  el.innerHTML = snap.docs.map(d => `
    <div class="item">
      <img src="${d.data().imagemUrl}">
      <button class="del" onclick="deleteGaleria('${d.id}')">×</button>
    </div>`).join('');
});
window.deleteGaleria = function(id){ if (confirm('Remover imagem?')) db.collection('galeria').doc(id).delete(); };

/* ---------- CONTATO ---------- */
document.getElementById('saveContato').addEventListener('click', () => {
  db.collection('config').doc('contato').set({
    email: document.getElementById('contatoEmail').value,
    instagram: document.getElementById('contatoInstagram').value,
    facebook: document.getElementById('contatoFacebook').value,
    discord: document.getElementById('contatoDiscord').value
  }, { merge: true }).then(() => setStatus('statusContato', 'Salvo com sucesso.'));
});

/* ---------- CARREGAR DADOS EXISTENTES AO ABRIR ---------- */
function initDashboardData(){
  db.collection('config').doc('site').get().then(doc => {
    const d = doc.data(); if (!d) return;
    document.getElementById('heroTitle').value = d.heroTitle || '';
    document.getElementById('heroMotto').value = d.heroMotto || '';
    document.getElementById('totalAfiliados').value = d.totalAfiliados || '';
    document.getElementById('heroMediaType').value = d.heroMediaType || 'image';
    if (d.heroLogoUrl){ document.getElementById('previewLogo').src = d.heroLogoUrl; document.getElementById('previewLogo').style.display='block'; }
    if (d.heroMediaUrl){
      if (d.heroMediaType === 'video'){ document.getElementById('previewMediaVideo').src = d.heroMediaUrl; document.getElementById('previewMediaVideo').style.display='block'; }
      else { document.getElementById('previewMediaImg').src = d.heroMediaUrl; document.getElementById('previewMediaImg').style.display='block'; }
    }
  });
  db.collection('config').doc('sobre').get().then(doc => {
    const d = doc.data(); if (d) document.getElementById('sobreTexto').value = d.texto || '';
  });
  db.collection('config').doc('contato').get().then(doc => {
    const d = doc.data(); if (!d) return;
    document.getElementById('contatoEmail').value = d.email || '';
    document.getElementById('contatoInstagram').value = d.instagram || '';
    document.getElementById('contatoFacebook').value = d.facebook || '';
    document.getElementById('contatoDiscord').value = d.discord || '';
  });
}
</script>
</body>
</html>
